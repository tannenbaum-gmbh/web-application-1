name: Business Requirements Check

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  requirements-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: web-application
      
      - name: Checkout business-requirements repository
        uses: actions/checkout@v4
        with:
          repository: tannenbaum-gmbh/business-requirements
          path: business-requirements
          token: ${{ secrets.BUSINESS_REQUIREMENTS_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Install GitHub Copilot CLI
        run: |
          # Install GitHub Copilot CLI using official method
          # https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-cli
          npm install -g @github/copilot
      
      - name: Run Business Requirements Check
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cd web-application
          
          # Copy business-requirements content to root folder
          if [ -d ../business-requirements ]; then
            cp -r ../business-requirements/* .
            cp -r ../business-requirements/.[^.]* . 2>/dev/null || true
          fi
          
          # Save issue content to a file for the agent to review
          echo "# Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" > issue-content.md
          echo "" >> issue-content.md
          echo "${ISSUE_BODY}" >> issue-content.md
          
          # Invoke the business-requirements-checker custom agent
          copilot --agent business-requirements-checker --model claude-opus-4.5 -p "review the issue content in issue-content.md against business requirements and store the findings in a file called business-requirements-findings.md" --allow-all
          
          # Create a placeholder if the file doesn't exist
          if [ ! -f business-requirements-findings.md ]; then
            echo "business-requirements-checker agent failed to create results."
            exit -1
          fi
      
      - name: Read requirements findings
        id: requirements
        run: |
          cd web-application
          if [ -f business-requirements-findings.md ]; then
            # Read the requirements findings file and prepare for issue comment
            FINDINGS=$(cat business-requirements-findings.md)
            
            # Use heredoc to handle multiline content properly
            echo "findings<<EOF" >> $GITHUB_OUTPUT
            echo "$FINDINGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "findings=No requirements findings file generated." >> $GITHUB_OUTPUT
          fi
      
      - name: Post requirements findings as issue comment
        uses: actions/github-script@v7
        env:
          FINDINGS: ${{ steps.requirements.outputs.findings }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const findings = process.env.FINDINGS || 'No requirements findings available.';
            
            // Create or update comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('# Business Requirements Check')
            );
            
            const commentBody = findings;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
