name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., Version 1.0.0)'
        required: true
        type: string
      version_tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag format
        run: |
          VERSION_TAG="${{ inputs.version_tag }}"
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version tag must follow semver format (e.g., v1.0.0)"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          VERSION_TAG="${{ inputs.version_tag }}"
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $VERSION_TAG already exists"
            exit 1
          fi

      - name: Create release branch
        run: |
          VERSION_TAG="${{ inputs.version_tag }}"
          BRANCH_NAME="release/$VERSION_TAG"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          echo "Created and pushed branch: $BRANCH_NAME"

      - name: Install GitHub Copilot CLI
        run: |
          # Install GitHub Copilot CLI using official method
          # https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-cli
          npm install -g @github/copilot

      - name: Get last release tag
        id: last_release
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "no_previous_release=true" >> $GITHUB_OUTPUT
            echo "last_tag=" >> $GITHUB_OUTPUT
            echo "No previous release found"
          else
            echo "no_previous_release=false" >> $GITHUB_OUTPUT
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "Last release: $LAST_TAG"
          fi

      - name: Generate changes summary with GitHub Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # Get commit log and diff based on whether there's a previous release
          if [ "${{ steps.last_release.outputs.no_previous_release }}" = "true" ]; then
            echo "Analyzing all changes (no previous release)"
            git log --oneline > commits.txt
            git diff --root HEAD > changes.diff
          else
            LAST_TAG="${{ steps.last_release.outputs.last_tag }}"
            echo "Analyzing changes from $LAST_TAG to HEAD"
            git log --oneline "$LAST_TAG..HEAD" > commits.txt
            git diff "$LAST_TAG..HEAD" > changes.diff
          fi

          # Create a prompt for Copilot CLI to analyze the changes
          cat > analysis_prompt.txt <<'EOF'
          Analyze the following git commits and changes for a release. Create a comprehensive release notes document that includes:

          1. A brief summary of the release
          2. Key features and improvements
          3. Bug fixes
          4. Breaking changes (if any)
          5. Technical changes

          Format the output in Markdown suitable for GitHub release notes.

          Commits:
          EOF

          cat commits.txt >> analysis_prompt.txt

          echo "" >> analysis_prompt.txt
          echo "Diff summary:" >> analysis_prompt.txt
          if [ "${{ steps.last_release.outputs.no_previous_release }}" = "true" ]; then
            git diff --stat --root HEAD >> analysis_prompt.txt
          else
            LAST_TAG="${{ steps.last_release.outputs.last_tag }}"
            git diff --stat "$LAST_TAG..HEAD" >> analysis_prompt.txt
          fi

          # Use Copilot CLI to generate release notes
          if copilot -p "$(cat analysis_prompt.txt)" > release-notes.md 2>/dev/null; then
            echo "Successfully generated release notes with Copilot CLI"
          else
            echo "Copilot CLI failed, using fallback"
            RELEASE_NAME="${{ inputs.release_name }}"
            printf "# Release %s\n\n## Changes\n\n" "$RELEASE_NAME" > release-notes.md
            cat commits.txt >> release-notes.md
          fi

          echo "Generated release notes:"
          cat release-notes.md

      - name: Create release notes file
        run: |
          # Ensure release notes exist (backup fallback)
          if [ ! -f release-notes.md ]; then
            echo "Creating fallback release notes"
            RELEASE_NAME="${{ inputs.release_name }}"
            printf "# %s\n\n## Changes\n\n" "$RELEASE_NAME" > release-notes.md

            if [ "${{ steps.last_release.outputs.no_previous_release }}" = "true" ]; then
              git log --oneline >> release-notes.md
            else
              LAST_TAG="${{ steps.last_release.outputs.last_tag }}"
              git log --oneline "$LAST_TAG..HEAD" >> release-notes.md
            fi
          fi

          echo "Final release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CREATE_GITHUB_TOKEN }}
        run: |
          VERSION_TAG="${{ inputs.version_tag }}"
          RELEASE_NAME="${{ inputs.release_name }}"
          BRANCH_NAME="release/$VERSION_TAG"

          # Create the release using GitHub CLI
          gh release create "$VERSION_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --target "$BRANCH_NAME"

          echo "=========================================="
          echo "Release Created Successfully!"
          echo "=========================================="
          echo "Release Name: $RELEASE_NAME"
          echo "Version Tag: $VERSION_TAG"
          echo "Release Branch: $BRANCH_NAME"
          echo "=========================================="

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Create Release Workflow Summary"
          echo "=========================================="
          echo "Release Name: ${{ inputs.release_name }}"
          echo "Version Tag: ${{ inputs.version_tag }}"
          echo "Release Branch: release/${{ inputs.version_tag }}"
          if [ -f release-notes.md ]; then
            echo "✓ Release notes generated"
          else
            echo "✗ Release notes generation failed"
          fi
          echo "=========================================="
